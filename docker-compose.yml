services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmdev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swarmdev
    ports:
      # Host 5434 avoids clashing with other local Postgres instances (5432/5433 taken).
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Throwaway server for crash-recovery trials: `docker compose --profile chaos up -d`.
  # Commit timestamps let the invariant checker order writes against takeovers.
  # Durability is off because the backend gets killed in trials, not Postgres.
  postgres-chaos:
    image: postgres:16-alpine
    container_name: swarmdev-postgres-chaos
    profiles: [chaos]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - track_commit_timestamp=on
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

volumes:
  postgres_data:
